name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      MEDISTOCK_TEST_SERVER: 164.92.97.131
      MEDISTOCK_TEST_USER: RizikiDev
      MEDISTOCK_TEST_PASSWORD: ${{ secrets.MEDISTOCK_TEST_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build MediStock.API/MediStock.API.csproj -c Debug --nologo

      - name: Run integration tests
        run: dotnet test MediStock.Tests/MediStock.Tests.csproj -c Debug --nologo