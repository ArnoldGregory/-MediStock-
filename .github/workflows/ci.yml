name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: medistock-ci
          MYSQL_DATABASE: medistock_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pmedistock-ci --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build MediStock.API/MediStock.API.csproj -c Debug --nologo

      - name: Run integration tests
        run: dotnet test MediStock.Tests/MediStock.Tests.csproj -c Debug --nologo
        env:
          MEDISTOCK_TEST_SERVER: 127.0.0.1
          MEDISTOCK_TEST_PORT: 3307
          MEDISTOCK_TEST_USER: root
          MEDISTOCK_TEST_PASSWORD: medistock-ci